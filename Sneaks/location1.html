<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnEAKs | Exclusive Sneaker Drops</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stripe JavaScript SDK -->
    <script src="https://js.stripe.com/v3/"></script>
    
    <style>
        :root {
            --primary: #78091c;         /* Custom Deep Rose / Sneakerhead Red */
            --primary-hover: #e11d48;
            --dark: #0f172a;            /* Dark Slate */
            --light: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --gray: #64748b;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--light); color: var(--dark); }
        h1, h2, h3, .logo { font-family: var(--font-heading); }

        /* Navbar */
        header { 
            background: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1rem 5%; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.04); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 1.8rem; 
            font-weight: 800; 
            letter-spacing: -1px; 
        }

        .logo-badge {
            background: var(--dark);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-text .accent { color: var(--primary); }

        .cart-btn { 
            background: var(--dark); 
            color: #fff; 
            border: none; 
            padding: 0.65rem 1.3rem; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .cart-btn:hover { background: var(--primary); }

        .cart-badge {
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Hero Banner */
        .hero { 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7)), 
                        url('https://images.unsplash.com/photo-1552346154-21d32810aba3?w=1200') center/cover;
            color: #fff; 
            padding: 5rem 1rem; 
            text-align: center; 
        }

        .hero h1 { font-size: 3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .hero p { font-size: 1.1rem; color: #cbd5e1; margin-top: 0.5rem; }

        /* Container & Grid */
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 1.5rem; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .section-header h2 { font-size: 2rem; font-weight: 700; }

        /* Category Filter Bar */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .filter-chip {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--dark);
            padding: 0.5rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip:hover, 
        .filter-chip.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 2rem; 
        }

        /* Sneaker Card */
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            padding: 1rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.08); 
        }

        .tag {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: var(--dark);
            color: #fff;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 2;
        }

        .image-container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 1rem;
            background: #f1f5f9;
        }

        .image-container img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover .image-container img {
            transform: scale(1.04);
        }

        .quick-view-btn {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            white-space: nowrap;
        }

        .card:hover .quick-view-btn {
            bottom: 12px;
            opacity: 1;
        }

        .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
        .card .category { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; margin-bottom: 0.4rem; }
        .card .price { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-bottom: 0.8rem; }

        /* Option Group Inputs (Size & Custom Color Textbox) */
        .option-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            gap: 10px;
        }

        .option-group label {
            white-space: nowrap;
        }

        .option-group select,
        .option-group input[type="text"] {
            width: 55%;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-weight: 500;
            font-family: inherit;
            color: var(--dark);
            background: #fff;
        }

        .option-group input[type="text"]:focus,
        .option-group select:focus {
            outline: None;
            border-color: var(--primary);
        }

        .btn { 
            width: 100%; 
            padding: 0.75rem; 
            background: var(--dark); 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600;
            transition: background 0.2s;
            margin-top: auto;
        }

        .btn:hover { background: var(--primary); }

        /* Modals */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
        .close { position: absolute; top: 1.2rem; right: 1.5rem; cursor: pointer; font-size: 1.5rem; color: var(--gray); }

        /* Quick View Modal Layout */
        .quick-view-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            align-items: center;
        }

        @media (max-width: 600px) {
            .quick-view-body { grid-template-columns: 1fr; }
        }

        .quick-view-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
        }

        .quick-view-details h3 {
            font-size: 1.4rem;
            margin-bottom: 0.3rem;
        }

        .quick-view-details .price {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 800;
            margin: 0.4rem 0;
        }

        .quick-view-details .description {
            font-size: 0.85rem;
            color: var(--gray);
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        #card-element { border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin: 1rem 0; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 6px; }
        #pay-btn { background: var(--primary); margin-top: 1rem; }
        #payment-message { margin-top: 1rem; font-size: 0.9rem; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="logo">
            <div class="logo-badge"><i class="fas fa-shoe-prints"></i></div>
            <span class="logo-text">SnEAK<span class="accent">s</span></span>
        </div>
        <button class="cart-btn" onclick="openCart()">
            <i class="fas fa-shopping-bag"></i> Bag 
            <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Fresh Sneaker Drops</h1>
        <p>Authentic, limited-edition kicks. Custom colorways available on request.</p>
    </section>

    <!-- PRODUCTS SECTION -->
    <div class="container">
        <div class="section-header">
            <h2>Trending Kicks</h2>
        </div>

        <!-- Category Filters -->
        <div class="filter-bar" id="filter-bar"></div>

        <!-- Product Grid -->
        <div class="grid" id="product-grid"></div>
    </div>

    <!-- QUICK VIEW MODAL -->
    <div class="modal" id="quick-view-modal">
        <div class="modal-content" style="max-width: 680px;">
            <span class="close" onclick="closeQuickView()">&times;</span>
            <div id="quick-view-content"></div>
        </div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Your Shopping Bag</h2>
            <div id="cart-summary" style="margin: 1.5rem 0;"></div>

            <form id="payment-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="cust-name" required placeholder="Alex Mercer">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="cust-email" required placeholder="alex@example.com">
                </div>

                <!-- DROPOFF LOCATION INPUT -->
                <div class="input-group">
                    <label>Dropoff Location / Delivery Address</label>
                    <input type="text" id="cust-address" required placeholder="e.g. House No. 14, East Legon, Accra">
                </div>

                <label style="font-size: 0.85rem; font-weight: 600;">Credit or Debit Card</label>
                <div id="card-element"></div>

                <button class="btn" id="pay-btn" type="submit">Complete Order</button>
                <div id="payment-message"></div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Stripe Initialization
        const stripe = Stripe('pk_test_your_stripe_public_key_here');
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#card-element');

        // PRODUCTS CATALOG
        const products = [
            { 
                id: 1, 
                name: "Birkenstocks", 
                price: 2800.00, 
                tag: "Hot Drop", 
                category: "High Tops", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673784/Screenshot_20260917_192529_Snapchat.jpg",
                description: "Bold high-top sneakers with rich leather paneling and targeted ankle padding for maximum urban comfort."
            },
            { 
                id: 2, 
                name: "Air Jordan 11", 
                price: 2250.00, 
                tag: "Popular", 
                category: "Streetwear", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673781/Screenshot_20260917_192419_Snapchat.jpg",
                description: "Lightweight mesh upper paired with layered color overlays built for everyday street moves."
            },
            { 
                id: 3, 
                name: "Nike Air Force 1", 
                price: 1150.00, 
                tag: "Essential", 
                category: "Low Tops", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673759/Screenshot_20260917_192449_Snapchat.jpg",
                description: "Durable cotton canvas upper with vulcanized rubber soles. Timeless, casual style for any fit."
            },
            { 
                id: 4, 
                name: "Air Jordan 4", 
                price: 1850.00, 
                tag: "Bestseller", 
                category: "Lifestyle", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673756/Screenshot_20260917_192538_Snapchat.jpg",
                description: "Ultra-clean leather construction with subtle branding and all-day cushioned insoles."
            },
            { 
                id: 5, 
                name: "Nike Air Force 1", 
                price: 2500.00, 
                tag: "Trending", 
                category: "Chunky", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673756/Screenshot_20260917_192535_Snapchat.jpg",
                description: "Sculpted thick midsole with layered suede and textile panels for a high-volume street profile."
            },
            { 
                id: 6, 
                name: "Nike Dunks Low", 
                price: 2100.00, 
                tag: "New", 
                category: "Performance", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673740/Screenshot_20260917_192520_Snapchat.jpg",
                description: "Aggressive tread pattern with moisture-wicking synthetic upper built for both road and dirt trails."
            },
            { 
                id: 7, 
                name: "Air Jordan 1", 
                price: 1700.00, 
                tag: "Classic", 
                category: "Court", 
                image: "https://res.cloudinary.com/imqjmexy/image/upload/v1789673740/Screenshot_20260917_192500_Snapchat.jpg",
                description: "Vintage court style revived with smooth leather and reinforced toe guards."
            },
            
        ];

        let cart = [];
        let selectedCategory = "All";

        // Render Category Filter Buttons
        function renderFilters() {
            const categories = ["All", ...new Set(products.map(p => p.category))];
            const filterContainer = document.getElementById('filter-bar');

            filterContainer.innerHTML = categories.map(cat => `
                <button 
                    class="filter-chip ${cat === selectedCategory ? 'active' : ''}" 
                    onclick="setCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(category) {
            selectedCategory = category;
            renderFilters();
            renderProducts();
        }

        // Render Sneaker Cards Grid
        function renderProducts() {
            const filtered = selectedCategory === "All" 
                ? products 
                : products.filter(p => p.category === selectedCategory);

            const grid = document.getElementById('product-grid');

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--gray);">No sneakers found in this category.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="card">
                    <span class="tag">${p.tag}</span>
                    <div class="image-container">
                        <img src="${p.image}" alt="${p.name}">
                        <button class="quick-view-btn" onclick="openQuickView(${p.id})">
                            <i class="fas fa-eye"></i> Quick View
                        </button>
                    </div>
                    <div class="category">${p.category}</div>
                    <h3>${p.name}</h3>
                    <div class="price">GH₵ ${p.price.toFixed(2)}</div>
                    
                    <!-- Preferred Color Input Text Box -->
                    <div class="option-group">
                        <label for="color-${p.id}">Color:</label>
                        <input type="text" id="color-${p.id}" placeholder="e.g. Red, Black, White">
                    </div>

                    <!-- Size Selector -->
                    <div class="option-group">
                        <label for="size-${p.id}">Size:</label>
                        <select id="size-${p.id}">
                            <option value="US 7">US 7</option>
                            <option value="US 8">US 8</option>
                            <option value="US 9" selected>US 9</option>
                            <option value="US 10">US 10</option>
                            <option value="US 11">US 11</option>
                            <option value="US 12">US 12</option>
                        </select>
                    </div>

                    <button class="btn" onclick="addToCart(${p.id})">Add to Bag</button>
                </div>
            `).join('');
        }

        // Add Product to Cart with typed Preferred Color & Size
        function addToCart(id, customColor = null, customSize = null) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const sizeSelect = document.getElementById(`size-${id}`);
            const selectedSize = customSize || (sizeSelect ? sizeSelect.value : 'US 9');
            
            const colorInput = document.getElementById(`color-${id}`);
            const typedColor = customColor || (colorInput ? colorInput.value.trim() : '');
            const selectedColor = typedColor !== '' ? typedColor : 'As shown';

            const item = cart.find(i => i.id === id && i.size === selectedSize && i.color.toLowerCase() === selectedColor.toLowerCase());
            if (item) {
                item.quantity++;
            } else {
                cart.push({ 
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    size: selectedSize, 
                    color: selectedColor, 
                    quantity: 1 
                });
            }
            document.getElementById('cart-count').textContent = cart.reduce((a, b) => a + b.quantity, 0);
        }

        // Quick View Modal
        function openQuickView(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            // Get existing card inputs if any
            const cardColor = document.getElementById(`color-${id}`)?.value || '';

            document.getElementById('quick-view-content').innerHTML = `
                <div class="quick-view-body">
                    <img src="${product.image}" alt="${product.name}" class="quick-view-img">
                    <div class="quick-view-details">
                        <div class="category">${product.category} • <span style="color:var(--primary); font-weight:700;">${product.tag}</span></div>
                        <h3>${product.name}</h3>
                        <div class="price">GH₵ ${product.price.toFixed(2)}</div>
                        <p class="description">${product.description}</p>
                        
                        <div class="option-group" style="margin-bottom: 1rem;">
                            <label for="qv-color-${product.id}">Preferred Color:</label>
                            <input type="text" id="qv-color-${product.id}" placeholder="e.g. Red, Black, White" value="${cardColor}">
                        </div>

                        <div class="option-group" style="margin-bottom: 1.2rem;">
                            <label for="qv-size-${product.id}">Select Size:</label>
                            <select id="qv-size-${product.id}">
                                <option value="US 7">US 7</option>
                                <option value="US 8">US 8</option>
                                <option value="US 9" selected>US 9</option>
                                <option value="US 10">US 10</option>
                                <option value="US 11">US 11</option>
                                <option value="US 12">US 12</option>
                            </select>
                        </div>

                        <button class="btn" onclick="addFromQuickView(${product.id})">Add to Bag</button>
                    </div>
                </div>
            `;

            document.getElementById('quick-view-modal').style.display = 'flex';
        }

        function closeQuickView() {
            document.getElementById('quick-view-modal').style.display = 'none';
        }

        function addFromQuickView(id) {
            const sizeVal = document.getElementById(`qv-size-${id}`).value;
            const colorVal = document.getElementById(`qv-color-${id}`).value;

            // Sync values back to main card
            const mainCardColor = document.getElementById(`color-${id}`);
            const mainCardSize = document.getElementById(`size-${id}`);
            if (mainCardColor) mainCardColor.value = colorVal;
            if (mainCardSize) mainCardSize.value = sizeVal;

            addToCart(id, colorVal, sizeVal);
            closeQuickView();
        }

        // Cart Modal & Checkout Handler
        function openCart() {
            if(cart.length === 0) return alert("Your shopping bag is empty!");
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            document.getElementById('cart-summary').innerHTML = `
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem;">
                    ${cart.map(item => `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; font-size:0.95rem;">
                            <div style="display:flex; gap:10px; align-items:center;">
                                <img src="${item.image}" style="width:48px; height:48px; object-fit:cover; border-radius:6px;">
                                <div>
                                    <strong>${item.name}</strong> 
                                    <div style="color:var(--gray); font-size:0.8rem;">Size: ${item.size} | Color: <strong>${item.color}</strong></div>
                                    <div style="font-size:0.85rem;">Qty: ${item.quantity}</div>
                                </div>
                            </div>
                            <span style="font-weight:700;">GH₵ ${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
                <div style="font-size: 1.2rem; font-weight: 800;">Total Amount: GH₵ ${total.toFixed(2)}</div>
            `;
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        // Stripe Payment Processing
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payBtn = document.getElementById('pay-btn');
            const msg = document.getElementById('payment-message');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const dropoffLocation = document.getElementById('cust-address').value;

            try {
                const res = await fetch('http://localhost:5000/api/create-payment-intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        cart, 
                        customerName: name, 
                        customerEmail: email,
                        dropoffLocation 
                    })
                });

                const { clientSecret, error: backendError } = await res.json();
                if(backendError) throw new Error(backendError);

                const result = await stripe.confirmCardPayment(clientSecret, {
                    payment_method: {
                        card: cardElement,
                        billing_details: { name, email }
                    }
                });

                if (result.error) {
                    msg.textContent = result.error.message;
                    payBtn.disabled = false;
                    payBtn.textContent = 'Complete Order';
                } else {
                    if (result.paymentIntent.status === 'succeeded') {
                        alert('Payment Successful! Your sneakers are on the way.');
                        cart = [];
                        document.getElementById('cart-count').textContent = '0';
                        closeCart();
                    }
                }
            } catch (err) {
                msg.textContent = err.message;
                payBtn.disabled = false;
                payBtn.textContent = 'Complete Order';
            }
        });

        // Initialize App
        renderFilters();
        renderProducts();
    </script>
</body>
</html>
