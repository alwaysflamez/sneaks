<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopyy | Exclusive Sneaker Drops</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Stripe JavaScript SDK -->
    <script src="https://js.stripe.com/v3/"></script>
    
    <style>
        :root {
            --primary: #f43f5e;         /* Vibrant Rose / Sneakerhead Red */
            --primary-hover: #e11d48;
            --dark: #0f172a;            /* Dark Slate */
            --light: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --gray: #64748b;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-body); background: var(--light); color: var(--dark); }
        h1, h2, h3, .logo { font-family: var(--font-heading); }

        /* Navbar */
        header { 
            background: #ffffff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 1rem 5%; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.04); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 1.8rem; 
            font-weight: 800; 
            letter-spacing: -1px; 
        }

        .logo-badge {
            background: var(--dark);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-text .accent { color: var(--primary); }

        .cart-btn { 
            background: var(--dark); 
            color: #fff; 
            border: none; 
            padding: 0.65rem 1.3rem; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .cart-btn:hover { background: var(--primary); }

        .cart-badge {
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Hero Banner */
        .hero { 
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7)), 
                        url('https://images.unsplash.com/photo-1552346154-21d32810aba3?w=1200') center/cover;
            color: #fff; 
            padding: 5rem 1rem; 
            text-align: center; 
        }

        .hero h1 { font-size: 3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .hero p { font-size: 1.1rem; color: #cbd5e1; margin-top: 0.5rem; }

        /* Container & Grid */
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 1.5rem; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .section-header h2 { font-size: 2rem; font-weight: 700; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 2rem; 
        }

        /* Sneaker Card */
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            padding: 1rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 12px 25px rgba(0,0,0,0.08); 
        }

        .tag {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: var(--dark);
            color: #fff;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 1rem;
        }

        .card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
        .card .category { font-size: 0.8rem; color: var(--gray); text-transform: uppercase; margin-bottom: 0.8rem; }
        .card .price { font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-bottom: 1rem; }

        .btn { 
            width: 100%; 
            padding: 0.75rem; 
            background: var(--dark); 
            color: #fff; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: 600;
            transition: background 0.2s;
            margin-top: auto;
        }

        .btn:hover { background: var(--primary); }

        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #fff; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
        .close { position: absolute; top: 1.2rem; right: 1.5rem; cursor: pointer; font-size: 1.5rem; color: var(--gray); }

        #card-element { border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin: 1rem 0; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.3rem; font-size: 0.85rem; font-weight: 600; }
        .input-group input { width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 6px; }
        #pay-btn { background: var(--primary); margin-top: 1rem; }
        #payment-message { margin-top: 1rem; font-size: 0.9rem; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="logo">
            <div class="logo-badge"><i class="fas fa-shoe-prints"></i></div>
            <span class="logo-text">shop<span class="accent">yy</span></span>
        </div>
        <button class="cart-btn" onclick="openCart()">
            <i class="fas fa-shopping-bag"></i> Bag 
            <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>Fresh Sneaker Drops</h1>
        <p>Authentic, limited-edition kicks delivered to your doorstep.</p>
    </section>

    <!-- PRODUCTS GRID -->
    <div class="container">
        <div class="section-header">
            <h2>Trending Kicks</h2>
        </div>
        <div class="grid" id="product-grid"></div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Your Shopping Bag</h2>
            <div id="cart-summary" style="margin: 1.5rem 0;"></div>

            <form id="payment-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="cust-name" required placeholder="Alex Mercer">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="cust-email" required placeholder="alex@example.com">
                </div>

                <label style="font-size: 0.85rem; font-weight: 600;">Credit or Debit Card</label>
                <div id="card-element"></div>

                <button class="btn" id="pay-btn" type="submit">Complete Order</button>
                <div id="payment-message"></div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Stripe Initialization (Replace with your actual public key)
        const stripe = Stripe('pk_test_your_stripe_public_key_here');
        const elements = stripe.elements();
        const cardElement = elements.create('card');
        cardElement.mount('#card-element');

        // 10 SNEAKER PRODUCTS
        const products = [
            { id: 1, name: "Air Retro Crimson", price: 179.99, tag: "Hot Drop", category: "High Tops", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" },
            { id: 2, name: "Street Wave Multi-Tone", price: 145.00, tag: "Popular", category: "Streetwear", image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500" },
            { id: 3, name: "Classic Mustard Canvas", price: 75.00, tag: "Essential", category: "Low Tops", image: "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500" },
            { id: 4, name: "Jordan Retro High OG", price: 210.00, tag: "Limited", category: "Basketball", image: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?w=500" },
            { id: 5, name: "Minimalist Triple White", price: 120.00, tag: "Bestseller", category: "Lifestyle", image: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=500" },
            { id: 6, name: "Urban Chunky Dad Shoe", price: 160.00, tag: "Trending", category: "Chunky", image: "https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500" },
            { id: 7, name: "Nitro Trail Runner", price: 135.00, tag: "New", category: "Performance", image: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" },
            { id: 8, name: "Heritage Leather Court", price: 110.00, tag: "Classic", category: "Court", image: "https://images.unsplash.com/photo-1539185441755-769473a23570?w=500" },
            { id: 9, name: "Neon Volt Speedster", price: 185.00, tag: "Hot Drop", category: "Running", image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=500" },
            { id: 10, name: "Pro Elite Trainer", price: 195.00, tag: "Exclusive", category: "Athletic", image: "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500" }
        ];

        let cart = [];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="card">
                    <span class="tag">${p.tag}</span>
                    <img src="${p.image}" alt="${p.name}">
                    <div class="category">${p.category}</div>
                    <h3>${p.name}</h3>
                    <div class="price">$${p.price.toFixed(2)}</div>
                    <button class="btn" onclick="addToCart(${p.id})">Add to Bag</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = cart.find(i => i.id === id);
            if(item) item.quantity++;
            else cart.push({ ...products.find(p => p.id === id), quantity: 1 });
            document.getElementById('cart-count').textContent = cart.reduce((a, b) => a + b.quantity, 0);
        }

        function openCart() {
            if(cart.length === 0) return alert("Your shopping bag is empty!");
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cart-summary').innerHTML = `
                <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem;">
                    ${cart.map(item => `
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem; font-size:0.95rem;">
                            <span><strong>${item.name}</strong> (x${item.quantity})</span>
                            <span>$${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
                <div style="font-size: 1.2rem; font-weight: 800;">Total Amount: $${total.toFixed(2)}</div>
            `;
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        // Stripe Payment Handler
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payBtn = document.getElementById('pay-btn');
            const msg = document.getElementById('payment-message');
            payBtn.disabled = true;
            payBtn.textContent = 'Processing...';

            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;

            try {
                const res = await fetch('http://localhost:5000/api/create-payment-intent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart, customerName: name, customerEmail: email })
                });

                const { clientSecret, error: backendError } = await res.json();
                if(backendError) throw new Error(backendError);

                const result = await stripe.confirmCardPayment(clientSecret, {
                    payment_method: {
                        card: cardElement,
                        billing_details: { name, email }
                    }
                });

                if (result.error) {
                    msg.textContent = result.error.message;
                    payBtn.disabled = false;
                    payBtn.textContent = 'Complete Order';
                } else {
                    if (result.paymentIntent.status === 'succeeded') {
                        alert('Payment Successful! Your sneakers are on the way.');
                        cart = [];
                        document.getElementById('cart-count').textContent = '0';
                        closeCart();
                    }
                }
            } catch (err) {
                msg.textContent = err.message;
                payBtn.disabled = false;
                payBtn.textContent = 'Complete Order';
            }
        });

        renderProducts();
    </script>
</body>
</html>
